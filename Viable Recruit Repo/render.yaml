services:
  - type: web
    name: viable-recruit-desk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: viable-recruit-desk-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TEAM_INVITE_CODE
        sync: false

databases:
  - name: viable-recruit-desk-db
    plan: free
